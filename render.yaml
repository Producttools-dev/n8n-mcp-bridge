services:
  - type: web
    name: tenantvibe-mcp-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PMS1_API_URL
        value: https://your-pms1-api.example.com
      - key: PMS1_API_KEY
        sync: false          # set secret in Render dashboard
      - key: PMS2_API_URL
        value: https://your-pms2-api.example.com
      - key: PMS2_API_KEY
        sync: false
      - key: GHL_API_URL
        value: https://services.leadconnectorhq.com
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
